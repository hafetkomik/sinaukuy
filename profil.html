<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil – Sinaukuy</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #16161a;
      --border: #222228;
      --accent: #7c3aed;
      --accent2: #a855f7;
      --glow: rgba(124,58,237,0.25);
      --text: #f0eeff;
      --muted: #7b7a8e;
      --success: #22c55e;
      --danger: #f43f5e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .blob {
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
      border-radius: 50%;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    nav {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #a78bfa, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 480px;
      padding: 8px 24px 48px;
    }

    /* ── STEP INDICATOR ── */
    .steps {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 28px;
    }

    .step {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
    }

    .step.active {
      width: 24px;
      border-radius: 4px;
      background: var(--accent2);
    }

    /* ── TIM COMMENT ── */
    .tim-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin-bottom: 24px;
    }

    .tim-mini {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4c1d95, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
      border: 1.5px solid var(--accent);
    }

    .tim-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      padding: 10px 14px;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--muted);
      flex: 1;
    }

    .tim-bubble span { color: var(--accent2); font-weight: 600; }

    /* ── SECTION TITLE ── */
    .section-title {
      font-family: 'Syne', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .section-sub {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    /* ── FORM ── */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent2);
    }

    input[type="text"]::placeholder { color: var(--muted); }

    /* ── KELAS SELECTOR ── */
    .kelas-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .kelas-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 8px;
      color: var(--muted);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
    }

    .kelas-btn:hover {
      border-color: var(--accent2);
      color: var(--text);
    }

    .kelas-btn.selected {
      background: rgba(124,58,237,0.15);
      border-color: var(--accent2);
      color: var(--accent2);
    }

    /* ── AVATAR SELECTOR ── */
    .avatar-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .avatar-opt {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      font-size: 1.6rem;
      transition: all 0.15s;
    }

    .avatar-opt:hover { border-color: var(--accent2); }

    .avatar-opt.selected {
      background: rgba(124,58,237,0.15);
      border-color: var(--accent2);
      box-shadow: 0 0 12px var(--glow);
    }

    /* ── SUBMIT BTN ── */
    .btn-primary {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 28px;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px var(--glow);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px var(--glow);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ── LOADING ── */
    #loading {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13,13,15,0.9);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    #loading.show { display: flex; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent2);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text { font-size: 0.9rem; color: var(--muted); }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      transition: transform 0.3s;
      z-index: 200;
      white-space: nowrap;
    }

    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.success { background: var(--success); color: #fff; }
    #toast.error { background: var(--danger); color: #fff; }
  </style>
</head>
<body>

<div class="blob"></div>
<div id="loading">
  <div class="spinner"></div>
  <p class="loading-text">Bentar ya...</p>
</div>
<div id="toast"></div>

<nav>
  <div class="logo">sinaukuy</div>
</nav>

<div class="main">
  <div class="steps">
    <div class="step active"></div>
    <div class="step"></div>
    <div class="step"></div>
  </div>

  <div class="tim-row">
    <div class="tim-mini">🧑‍💻</div>
    <div class="tim-bubble" id="timComment">
      Isi dulu profilnya. <span>Beneran deh</span>, ini penting — biar gue tau harus nge-roast lo di level yang mana.
    </div>
  </div>

  <div class="section-title">Kenalan Dulu</div>
  <p class="section-sub">Isi data lo sekali aja, selesai.</p>

  <div class="form-group">
    <label>Nama Panggilan</label>
    <input type="text" id="nama" placeholder="Tulis nama lo..." maxlength="20" oninput="updateTim()"/>
  </div>

  <div class="form-group">
    <label>Pilih Avatar</label>
    <div class="avatar-grid">
      <div class="avatar-opt selected" onclick="selectAvatar(this, '🐼')">🐼</div>
      <div class="avatar-opt" onclick="selectAvatar(this, '🦊')">🦊</div>
      <div class="avatar-opt" onclick="selectAvatar(this, '🐸')">🐸</div>
      <div class="avatar-opt" onclick="selectAvatar(this, '🐯')">🐯</div>
      <div class="avatar-opt" onclick="selectAvatar(this, '🦁')">🦁</div>
      <div class="avatar-opt" onclick="selectAvatar(this, '🐺')">🐺</div>
      <div class="avatar-opt" onclick="selectAvatar(this, '🐧')">🐧</div>
      <div class="avatar-opt" onclick="selectAvatar(this, '🦄')">🦄</div>
    </div>
  </div>

  <div class="form-group">
    <label>Kelas Sekarang</label>
    <div class="kelas-grid">
      <button class="kelas-btn" onclick="selectKelas(this, '7')">Kelas 7</button>
      <button class="kelas-btn" onclick="selectKelas(this, '8')">Kelas 8</button>
      <button class="kelas-btn" onclick="selectKelas(this, '9')">Kelas 9</button>
      <button class="kelas-btn" onclick="selectKelas(this, '10')">Kelas 10</button>
      <button class="kelas-btn" onclick="selectKelas(this, '11')">Kelas 11</button>
      <button class="kelas-btn" onclick="selectKelas(this, '12')">Kelas 12</button>
    </div>
  </div>

  <button class="btn-primary" id="btnSimpan" onclick="simpanProfil()">
    Gas Belajar →
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://jpdxjjnxvskvspcvewxl.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwZHhqam54dnNrdnNwY3Zld3hsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NDM0MjYsImV4cCI6MjA5NjUxOTQyNn0.H_hcaZjbVDIXNP9YLba0U_nHWLf-9qHfo8hPWZMaoT8';

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: {
      detectSessionInUrl: true,
      flowType: 'implicit',
      persistSession: true,
      autoRefreshToken: true
    }
  });

  let selectedKelas = '';
  let selectedAvatar = '🐼';
  let currentUser = null;
  let sessionHandled = false;

  // Tangani session lewat event — lebih reliable untuk OAuth callback
  sb.auth.onAuthStateChange(async (event, session) => {
    if (sessionHandled) return;
    if (session) {
      sessionHandled = true;
      currentUser = session.user;
      await cekProfilAtauTampilkan();
    }
  });

  async function cekProfilAtauTampilkan() {
    const { data: profil } = await sb.from('profil')
      .select('*')
      .eq('user_id', currentUser.id)
      .maybeSingle();
    if (profil) {
      window.location.href = 'https://sinaukuyy.netlify.app/dashboard.html';
    }
    // kalau belum ada profil, biarkan halaman tampil untuk diisi
  }

  // Cek session awal (kalau sudah ada session tersimpan)
  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session && !sessionHandled) {
      sessionHandled = true;
      currentUser = session.user;
      await cekProfilAtauTampilkan();
      return;
    }

    // Kalau belum ada session, tunggu event onAuthStateChange max 4 detik
    setTimeout(() => {
      if (!sessionHandled && !currentUser) {
        window.location.href = 'https://sinaukuyy.netlify.app/index.html';
      }
    }, 4000);
  }
  init();

  function selectKelas(el, val) {
    document.querySelectorAll('.kelas-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    selectedKelas = val;
    updateTim();
  }

  function selectAvatar(el, val) {
    document.querySelectorAll('.avatar-opt').forEach(a => a.classList.remove('selected'));
    el.classList.add('selected');
    selectedAvatar = val;
  }

  function updateTim() {
    const nama = document.getElementById('nama').value.trim();
    const komentar = [
      `Isi dulu profilnya. <span>Beneran deh</span>, ini penting — biar gue tau harus nge-roast lo di level yang mana.`,
      nama ? `<span>${nama}</span>? Oke, nama yang... unik. Sekarang pilih kelas lo.` : `Isi dulu profilnya. <span>Beneran deh</span>, ini penting.`,
      nama && selectedKelas ? `Kelas ${selectedKelas}? Oke. Berarti harusnya udah bisa jawab yang basic dong, <span>${nama}</span>.` : (nama ? `<span>${nama}</span>? Oke. Sekarang pilih kelas lo.` : `Isi dulu profilnya. <span>Beneran deh</span>, ini penting.`),
    ];
    const idx = (nama ? 1 : 0) + (nama && selectedKelas ? 1 : 0);
    document.getElementById('timComment').innerHTML = komentar[Math.min(idx, 2)];
  }

  async function simpanProfil() {
    const nama = document.getElementById('nama').value.trim();
    if (!nama) { showToast('Nama lo kosong nih 😑', 'error'); return; }
    if (!selectedKelas) { showToast('Pilih kelas dulu!', 'error'); return; }

    showLoading(true);

    const { error } = await sb.from('profil').insert({
      user_id: currentUser.id,
      nama: nama,
      avatar: selectedAvatar,
      kelas: selectedKelas,
      xp: 0,
      streak: 0,
      created_at: new Date().toISOString()
    });

    showLoading(false);

    if (error) {
      showToast('Gagal simpan: ' + error.message, 'error');
    } else {
      showToast('Profil tersimpan! 🔥', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    }
  }

  function showLoading(show) {
    document.getElementById('loading').classList.toggle('show', show);
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `show ${type}`;
    setTimeout(() => t.className = '', 3000);
  }
</script>
</body>
</html>
